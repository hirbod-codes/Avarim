server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# Derives request/error/duration metrics and a service graph directly from
# spans, remote-written into Prometheus. Requires Prometheus to be started
# with --web.enable-remote-write-receiver (see compose.swarm.yml).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
    # (336h also happens to be Tempo's own built-in default — set explicitly
    # here just to keep it visible and matched to Loki's retention below.)
    compaction:
      block_retention: 336h # 14 days — match Loki's retention_period above
