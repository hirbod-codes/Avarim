# ROOT_ABSOLUTE_PATH is set in deploy.sh file

networks:
  observability:
    driver: overlay
    attachable: true

  backend_net:
    driver: overlay
    attachable: true

  db_net:
    driver: overlay
    attachable: true

secrets:
  AVARIM_TTS_API_KEY:
    external: true
  AVARIM_MONGODB_USERNAME:
    external: true
  AVARIM_MONGODB_PASSWORD:
    external: true
  AVARIM_MEILISEARCH_KEY:
    external: true
  AVARIM_STREAM_SIGNING_SECRET:
    external: true
  AVARIM_ACCESS_TOKEN_SECRET:
    external: true
  AVARIM_REFRESH_TOKEN_SECRET:
    external: true
  AVARIM_BUCKET_NAME:
    external: true
  AVARIM_S3_STORAGE_ENDPOINT:
    external: true
  AVARIM_S3_STORAGE_ACCESS_KEY:
    external: true
  AVARIM_S3_STORAGE_SECRET_KEY:
    external: true
  AVARIM_S3_API_KEY:
    external: true
  AVARIM_ME_CONFIG_MONGODB_ADMINUSERNAME:
    external: true
  AVARIM_ME_CONFIG_MONGODB_ADMINPASSWORD:
    external: true
  AVARIM_MONGO_INITDB_ROOT_USERNAME:
    external: true
  AVARIM_MONGO_INITDB_ROOT_PASSWORD:
    external: true
  AVARIM_MEILI_MASTER_KEY:
    external: true
  AVARIM_GF_SECURITY_ADMIN_USER:
    external: true
  AVARIM_GF_SECURITY_ADMIN_PASSWORD:
    external: true
  AVARIM_REDIS_USERNAME:
    external: true
  AVARIM_REDIS_PASSWORD:
    external: true
  AVARIM_REDIS_MASTER_PASSWORD:
    external: true
  AVARIM_MELIPAYAMAK_USERNAME:
    external: true
  AVARIM_MELIPAYAMAK_API_KEY:
    external: true
  AVARIM_MELIPAYAMAK_FROM:
    external: true
  AVARIM_ZARINPAL_MERCHANT_ID:
    external: true
  AVARIM_ZIBAL_MERCHANT_ID:
    external: true

services:
  nginx:
    image: ghcr.io/hirbod-codes/nginx:${AVARIM_NGINX_VERSION}
    ports:
      - "1404:443"
      - "443:443"
      - "80:80"
    networks:
      - backend_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  memoize:
    image: ghcr.io/hirbod-codes/memoize/backend:${AVARIM_BACKEND_VERSION}
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      LOG_DIR: /app/logs
      VIDEO_UPLOAD_TMP_DIR: ./video_tmp/
      AUDIO_UPLOAD_TMP_DIR: ./audio_tmp/
      IMAGE_UPLOAD_TMP_DIR: ./image_tmp/
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      LOKI_PUSH_URL: http://loki:3100
      PUSHGATEWAY_URL: http://pushgateway:9091
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: memoize.ir
      ALLOWED_ORIGINS: ${AVARIM_ALLOWED_ORIGINS}
      ENV_PREFIX: ${AVARIM_ENV_PREFIX}
      ENV_SUFFIX: ${AVARIM_ENV_SUFFIX}
      DB_DATABASE_NAME: Memoize
      DB_SUPPORTS_TRANSACTION: "false"
      DB_URL: mongodb://mongo:27017
      MAX_UPLOAD_SIZE: 50000000000

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE_INDEX: 0
      # REDIS_SUPPORTS_TRANSACTION:
      # REDIS_URL:

      MEILISEARCH_PORT: 7700
      MEILISEARCH_HOST: meilisearch

      SMS_PROVIDER_IDENTIFIER: melipayamak
      MELIPAYAMAK_BASE_ENDPOINT: ${AVARIM_MELIPAYAMAK_BASE_ENDPOINT}
      MELIPAYAMAK_VERIFICATION_MESSAGE_REFERENCE_ADDRESS: ${AVARIM_MELIPAYAMAK_VERIFICATION_MESSAGE_REFERENCE_ADDRESS}

      SUPPORTED_PAYMENT_METHODS: zarinpal
      ZARINPAL_URL: ${AVARIM_ZARINPAL_URL}
      ZIBAL_URL: ${AVARIM_ZIBAL_URL}

      TTS_API_KEY_FILE: /run/secrets/AVARIM_TTS_API_KEY
      MONGODB_USERNAME_FILE: /run/secrets/AVARIM_MONGODB_USERNAME
      MONGODB_PASSWORD_FILE: /run/secrets/AVARIM_MONGODB_PASSWORD
      REDIS_USERNAME_FILE: /run/secrets/AVARIM_REDIS_USERNAME
      REDIS_PASSWORD_FILE: /run/secrets/AVARIM_REDIS_PASSWORD
      MEILISEARCH_KEY_FILE: /run/secrets/AVARIM_MEILISEARCH_KEY
      STREAM_SIGNING_SECRET_FILE: /run/secrets/AVARIM_STREAM_SIGNING_SECRET
      ACCESS_TOKEN_SECRET_FILE: /run/secrets/AVARIM_ACCESS_TOKEN_SECRET
      REFRESH_TOKEN_SECRET_FILE: /run/secrets/AVARIM_REFRESH_TOKEN_SECRET
      BUCKET_NAME_FILE: /run/secrets/AVARIM_BUCKET_NAME
      S3_STORAGE_ENDPOINT_FILE: /run/secrets/AVARIM_S3_STORAGE_ENDPOINT
      S3_STORAGE_ACCESS_KEY_FILE: /run/secrets/AVARIM_S3_STORAGE_ACCESS_KEY
      S3_STORAGE_SECRET_KEY_FILE: /run/secrets/AVARIM_S3_STORAGE_SECRET_KEY
      S3_API_KEY_FILE: /run/secrets/AVARIM_S3_API_KEY

      MELIPAYAMAK_USERNAME_FILE: /run/secrets/AVARIM_MELIPAYAMAK_USERNAME
      MELIPAYAMAK_API_KEY_FILE: /run/secrets/AVARIM_MELIPAYAMAK_API_KEY
      MELIPAYAMAK_FROM_FILE: /run/secrets/AVARIM_MELIPAYAMAK_FROM

      ZARINPAL_MERCHANT_ID_FILE: /run/secrets/AVARIM_ZARINPAL_MERCHANT_ID
      ZIBAL_MERCHANT_ID_FILE: /run/secrets/AVARIM_ZIBAL_MERCHANT_ID
    secrets:
      - AVARIM_TTS_API_KEY
      - AVARIM_MONGODB_USERNAME
      - AVARIM_MONGODB_PASSWORD
      - AVARIM_MEILISEARCH_KEY
      - AVARIM_STREAM_SIGNING_SECRET
      - AVARIM_ACCESS_TOKEN_SECRET
      - AVARIM_REFRESH_TOKEN_SECRET
      - AVARIM_BUCKET_NAME
      - AVARIM_S3_STORAGE_ENDPOINT
      - AVARIM_S3_STORAGE_ACCESS_KEY
      - AVARIM_S3_STORAGE_SECRET_KEY
      - AVARIM_S3_API_KEY
      - AVARIM_REDIS_USERNAME
      - AVARIM_REDIS_PASSWORD
      - AVARIM_MELIPAYAMAK_USERNAME
      - AVARIM_MELIPAYAMAK_API_KEY
      - AVARIM_MELIPAYAMAK_FROM
      - AVARIM_ZARINPAL_MERCHANT_ID
      - AVARIM_ZIBAL_MERCHANT_ID
    volumes:
      - ${ROOT_ABSOLUTE_PATH}/memoize_logs:/app/logs:rw
    networks:
      - db_net
      - backend_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      # resources:
      #   limits:
      #     cpus: "2.00"
      #     memory: 2G
      #   reservations:
      #     cpus: "0.25"
      #     memory: 256M

  mongo:
    image: mongo:8.2.7
    ports:
      - "${AVARIM_MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/AVARIM_MONGO_INITDB_ROOT_USERNAME
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/AVARIM_MONGO_INITDB_ROOT_PASSWORD
    secrets:
      - AVARIM_MONGO_INITDB_ROOT_USERNAME
      - AVARIM_MONGO_INITDB_ROOT_PASSWORD
    volumes:
      - ${ROOT_ABSOLUTE_PATH}/mongo_data:/data/db
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "2.00"
          memory: 2G
        reservations:
          cpus: "0.50"
          memory: 512M

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "${AVARIM_MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME_FILE: /run/secrets/AVARIM_ME_CONFIG_MONGODB_ADMINUSERNAME
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/AVARIM_ME_CONFIG_MONGODB_ADMINPASSWORD
      ME_CONFIG_MONGODB_SERVER: mongo
    secrets:
      - AVARIM_ME_CONFIG_MONGODB_ADMINUSERNAME
      - AVARIM_ME_CONFIG_MONGODB_ADMINPASSWORD
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M

  meilisearch:
    image: getmeili/meilisearch:v1.53.2
    ports:
      - "${AVARIM_MEILISEARCH_PORT}:7700"
    environment:
      MEILI_MASTER_KEY_FILE: /run/secrets/AVARIM_MEILI_MASTER_KEY
      MEILI_NO_ANALYTICS: "true"
      MEILI_EXPERIMENTAL_METRICS: "true"
    secrets:
      - AVARIM_MEILI_MASTER_KEY
    volumes:
      - ${ROOT_ABSOLUTE_PATH}/meili_data:/meili_data
    networks:
      - db_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    command: >
      sh -c '
        redis-server
        --requirepass "$$(cat /run/secrets/AVARIM_REDIS_MASTER_PASSWORD)"
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 60
        --dir /data
      '
    secrets:
      - AVARIM_REDIS_MASTER_PASSWORD
    volumes:
      - ./redis_data:/data
    networks:
      - db_net
    healthcheck:
      test: >
        sh -c '
          redis-cli -a "$$(cat /run/secrets/AVARIM_REDIS_MASTER_PASSWORD)" --no-auth-warning ping | grep -q PONG
        '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        order: stop-first # Redis is stateful; don't start a new one before the old one releases the volume

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ${ROOT_ABSOLUTE_PATH}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${ROOT_ABSOLUTE_PATH}/prometheus_data:/prometheus
    networks:
      - observability
      - backend_net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  grafana:
    image: grafana/grafana:13.0
    ports:
      - "${AVARIM_GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER_FILE: /run/secrets/GF_SECURITY_ADMIN_USER
      GF_SECURITY_ADMIN_PASSWORD_FILE: /run/secrets/AVARIM_GF_SECURITY_ADMIN_PASSWORD
    secrets:
      - AVARIM_GF_SECURITY_ADMIN_USER
      - AVARIM_GF_SECURITY_ADMIN_PASSWORD
    volumes:
      - ${ROOT_ABSOLUTE_PATH}/grafana/grafana_data:/var/lib/grafana
      - ${ROOT_ABSOLUTE_PATH}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${ROOT_ABSOLUTE_PATH}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - observability
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  loki:
    image: grafana/loki:3.7.6
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ${ROOT_ABSOLUTE_PATH}/loki.yml:/etc/loki/config.yml:ro
      - ${ROOT_ABSOLUTE_PATH}/loki_data:/loki
    networks:
      - observability
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  tempo:
    image: grafana/tempo:3.0.2
    command:
      - "-config.file=/etc/tempo/config.yml"
    volumes:
      - ${ROOT_ABSOLUTE_PATH}/tempo.yml:/etc/tempo/config.yml:ro
      - ${ROOT_ABSOLUTE_PATH}/tempo_data:/var/tempo
    networks:
      - observability
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  alloy:
    image: grafana/alloy:v1.18.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/udev:/run/udev:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - ${ROOT_ABSOLUTE_PATH}/alloy_data:/var/lib/alloy/data
      - ${ROOT_ABSOLUTE_PATH}/alloy.config:/etc/alloy/config.alloy:ro
      - ${ROOT_ABSOLUTE_PATH}/memoize_logs:/var/log/memoize:ro
    networks:
      - observability
      - backend_net
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - observability
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
