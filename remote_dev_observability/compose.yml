services:
  loki:
    container_name: loki
    image: grafana/loki:3.7.6
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/config.yml"
    ports:
      - "${LOKI_PORT}:3100" # pino-loki pushes here from local dev
    volumes:
      - ./loki.yml:/etc/loki/config.yml:ro
      - ./loki_data:/loki
    networks:
      - dev_observability

  tempo:
    container_name: tempo
    image: grafana/tempo:3.0.2
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/config.yml"
    ports:
      - "${TEMPO_GRPC_PORT}:4317" # OTLP gRPC — traceExporter in tracing.ts can use this
      - "${TEMPO_HTTP_PORT}:4318" # OTLP HTTP  — or this, matching OTLPTraceExporter's http default
    volumes:
      - ./tempo.yml:/etc/tempo/config.yml:ro
      - ./tempo_data:/var/tempo
    networks:
      - dev_observability

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus_data:/prometheus
    networks:
      - dev_observability

  pushgateway:
    container_name: pushgateway
    image: prom/pushgateway:v1.11.1
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_PORT}:9091"
    networks:
      - dev_observability

  grafana:
    container_name: grafana
    image: grafana/grafana:13.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dev_observability

  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - ${REDIS_PORT}:6379
    command: >
      sh -c '
        redis-server
        --requirepass "${ME_CONFIG_MONGODB_ADMINPASSWORD}"
        --appendonly yes
        --appendfsync everysec
        --save 900 1
        --save 300 10
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --tcp-keepalive 60
        --dir /data
      '
    volumes:
      - ./redis_data:/data
    networks:
      - dev_observability

  redis_commander:
    container_name: redis_commander
    image: rediscommander/redis-commander:9.30.1
    restart: unless-stopped
    ports:
      - ${REDIS_COMMANDER_PORT}:8081
    environment:
      REDIS_HOSTS: local:redis:6379
    networks:
      - dev_observability

  mongo:
    container_name: mongo
    image: mongo:8.2.7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ./mongo_data:/data/db
    networks:
      - dev_observability

  mongo_express:
    container_name: mongo_express
    image: mongo-express:1.0.2
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_BASICAUTH_USERNAME: ${ME_CONFIG_MONGODB_ADMINUSERNAME}
      ME_BASICAUTH_PASSWORD: ${ME_CONFIG_MONGODB_ADMINPASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
    networks:
      - dev_observability

  meilisearch:
    container_name: meilisearch
    image: getmeili/meilisearch:v1.53.2
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_PORT}:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
      MEILI_EXPERIMENTAL_METRICS: "true"
    volumes:
      - ./meili_data:/meili_data
    networks:
      - dev_observability

  meilisearch_ui:
    container_name: meilisearch_ui
    image: eyeix/meilisearch-ui:v0.15.1
    restart: unless-stopped
    ports:
      - "${MEILISEARCH_UI_PORT}:24900"
    networks:
      - dev_observability

networks:
  dev_observability:
    driver: bridge
