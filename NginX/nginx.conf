user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Docker's embedded DNS resolver — resolves container names at request time
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirect all HTTP -> HTTPS
    server {
        listen 80;
        server_name avarim.ir;
        return 301 https://$host$request_uri;
    }

    # --- avarim.ir -> static avarim files + avarim_backend:3000 API ---
    server {
        listen 443 ssl;
        http2 on;
        server_name avarim.ir;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        root /usr/share/nginx/html/avarim;
        index index.html;

        client_max_body_size 10240M;

        location = /39148404.txt {
            alias /var/www/html/39148404.txt;
            default_type text/plain;
        }

        # Static web app (SPA fallback)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API -> avarim_backend:3000
        location /api/ {
            set $upstream_2 avarim:3000;
            proxy_pass http://$upstream_2;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;

            proxy_request_buffering off;

            proxy_read_timeout 21600s;
            proxy_send_timeout 21600s;
        }
    }
}